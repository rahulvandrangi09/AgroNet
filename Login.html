<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Agronet - Login</title>
  <link rel="stylesheet" href="Signup.css" />
  <link rel="shortcut icon" href="Build/Doctor.jpg" type="image/png">
</head>

<body>
  <div id="main">
  <div id="heading">
    <div id="navbar">
      <div id="nav-left">
        <div id="right"><a href="Agronet.html" style="text-decoration: none; color: #FFD700;">Agronet</a></div>
      </div>
      <div id="nav-center">
        <ul>
          <li><a href="Agronet.html">Home</a></li>
          <li><a href="Agronet.html">About Us</a></li>
          <li><a href="Agronet.html">Medications</a></li>
          <li><a href="Agronet.html">Contact Us</a></li>
        </ul>
        <div id="google_translate_element"></div>
      </div>
    
      <div id="nav-right">
        <a href="Login.html">Login</a> /<a href="Signup.html">Signup</a>
      </div>
    </div>
    <div id="form-wrapper">
      <div id="container">
        <div id="form-section">
          <!-- Login Form -->
          <div id="login-container" class="form-container active">
            <h2 id="login-title">Login to Agronet</h2>
            <form id="login-form">
              <div id="email-group">
                <label for="login-email">Email</label>
                <input type="email" id="login-email" required />
              </div>
              <div id="password-group">
                <label for="login-password">Password</label>
                <input type="password" id="login-password" required />
              </div>
              <button type="submit" id="login-btn" class="submit-btn">Login</button>
              <p id="login-toggle-text">Don't have an account? <a href="Signup.html" style="color: #00274D; font-weight: bold; text-decoration: none;">Sign up</a></p>
            </form>
            <div id="social-login" class="social-login">
              <p>Or sign in with</p>
              <div id="social-icons">
                <a href="#"><img src="Build/gmail_5968534.png" alt="Gmail" /></a>
                <a href="#"><img src="Build/facebook_5968764.png" alt="Facebook" /></a>
                <a href="#"><img src="Build/twitter_5969020.png" alt="Twitter" /></a>
              </div>
            </div>          
          </div>
        </div>
      </div>
    </div>
    <footer id="footer">
      <div class="footer-content">
        <img src="Build/Doctor.jpg" alt="FarmDoc Logo" />
        <p>&copy; 2025 <span>Agronet</span>. All rights reserved.</p>
      </div>
    </footer>
  </div>
  <script type="module" src="login.js"></script>

</body>
</html>
